name: trivia_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  # Service locator
  get_it: ^8.2.0
  # Bloc for state management
  flutter_bloc: ^9.1.1
