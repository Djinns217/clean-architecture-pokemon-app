  shared_preferences: ^2.5.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.6
  bloc_test: ^10.0.0

  cupertino_icons: ^1.0.8

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true


